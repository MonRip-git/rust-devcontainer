<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Rust development workflow</title><desc id="d">A workflow from editing to formatting, linting, testing, auditing, and release build.</desc><rect width="1200" height="420" rx="24" fill="#101827"/><text x="60" y="66" fill="#f4f8fc" font-family="Arial" font-size="30" font-weight="700">RUST DEVELOPMENT WORKFLOW</text><g font-family="Arial" text-anchor="middle"><g><rect x="45" y="150" width="165" height="125" rx="16" fill="#1d3d5a" stroke="#67c9f4" stroke-width="2"/><text x="127" y="198" fill="#fff" font-size="20" font-weight="700">Edit</text><text x="127" y="231" fill="#c4ddec" font-size="14">VS Code</text></g><g><rect x="250" y="150" width="165" height="125" rx="16" fill="#25445b" stroke="#67c9f4" stroke-width="2"/><text x="332" y="198" fill="#fff" font-size="20" font-weight="700">Format</text><text x="332" y="231" fill="#c4ddec" font-size="14">cargo fmt</text></g><g><rect x="455" y="150" width="165" height="125" rx="16" fill="#25445b" stroke="#67c9f4" stroke-width="2"/><text x="537" y="198" fill="#fff" font-size="20" font-weight="700">Lint</text><text x="537" y="231" fill="#c4ddec" font-size="14">cargo clippy</text></g><g><rect x="660" y="150" width="165" height="125" rx="16" fill="#25445b" stroke="#67c9f4" stroke-width="2"/><text x="742" y="198" fill="#fff" font-size="20" font-weight="700">Test</text><text x="742" y="231" fill="#c4ddec" font-size="14">cargo nextest</text></g><g><rect x="865" y="150" width="145" height="125" rx="16" fill="#25445b" stroke="#67c9f4" stroke-width="2"/><text x="937" y="198" fill="#fff" font-size="20" font-weight="700">Audit</text><text x="937" y="231" fill="#c4ddec" font-size="14">cargo audit</text></g><g><rect x="1050" y="150" width="105" height="125" rx="16" fill="#653d31" stroke="#f08a5b" stroke-width="2"/><text x="1102" y="198" fill="#fff" font-size="18" font-weight="700">Build</text><text x="1102" y="231" fill="#f4d8ca" font-size="13">release</text></g></g><g stroke="#8edcff" stroke-width="3" fill="none"><path d="M210 212h35m-10-10 10 10-10 10M415 212h35m-10-10 10 10-10 10M620 212h35m-10-10 10 10-10 10M825 212h35m-10-10 10 10-10 10M1010 212h35m-10-10 10 10-10 10"/></g><text x="60" y="345" fill="#9bb6ca" font-family="Arial" font-size="16">Run the quality loop locally before pushing changes or creating a release.</text></svg>