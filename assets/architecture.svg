<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Dev Container architecture</title><desc id="d">VS Code and Dev Containers orchestrate Docker Compose, which builds Fedora 45 and provides Rust tools and a mounted workspace.</desc>
<rect width="1200" height="650" rx="24" fill="#101827"/><text x="60" y="62" fill="#f4f8fc" font-family="Arial" font-size="30" font-weight="700">SYSTEM ARCHITECTURE</text><text x="60" y="94" fill="#91abc2" font-family="Arial" font-size="16">A clear separation between editor, container runtime, image, and project workspace</text>
<g font-family="Arial" text-anchor="middle"><rect x="60" y="150" width="300" height="125" rx="18" fill="#1c3550" stroke="#5abbe9" stroke-width="2"/><text x="210" y="195" fill="#fff" font-size="22" font-weight="700">VS Code</text><text x="210" y="229" fill="#b9d6e9" font-size="15">Dev Containers extension</text>
<rect x="450" y="150" width="300" height="125" rx="18" fill="#1c3550" stroke="#5abbe9" stroke-width="2"/><text x="600" y="195" fill="#fff" font-size="22" font-weight="700">Docker Compose</text><text x="600" y="229" fill="#b9d6e9" font-size="15">Service + volumes + policy</text>
<rect x="840" y="150" width="300" height="125" rx="18" fill="#1c3550" stroke="#5abbe9" stroke-width="2"/><text x="990" y="195" fill="#fff" font-size="22" font-weight="700">Fedora 45</text><text x="990" y="229" fill="#b9d6e9" font-size="15">Container image</text>
<path d="M360 212H445M750 212H835" stroke="#77d4ff" stroke-width="4" stroke-linecap="round"/><path d="M435 202l12 10-12 10M825 202l12 10-12 10" fill="none" stroke="#77d4ff" stroke-width="3"/>
<rect x="130" y="390" width="270" height="145" rx="18" fill="#24384b" stroke="#e7794d" stroke-width="2"/><text x="265" y="435" fill="#fff" font-size="21" font-weight="700">Rust Toolchain</text><text x="265" y="470" fill="#d4e3ee" font-size="15">rustup · cargo · rustc</text><text x="265" y="496" fill="#d4e3ee" font-size="15">Clippy · rustfmt · LLDB</text>
<rect x="465" y="390" width="270" height="145" rx="18" fill="#24384b" stroke="#e7794d" stroke-width="2"/><text x="600" y="435" fill="#fff" font-size="21" font-weight="700">Workspace</text><text x="600" y="470" fill="#d4e3ee" font-size="15">Host repository mount</text><text x="600" y="496" fill="#d4e3ee" font-size="15">/workspace</text>
<rect x="800" y="390" width="270" height="145" rx="18" fill="#24384b" stroke="#e7794d" stroke-width="2"/><text x="935" y="435" fill="#fff" font-size="21" font-weight="700">Persistent Volumes</text><text x="935" y="470" fill="#d4e3ee" font-size="15">Cargo registry + git</text><text x="935" y="496" fill="#d4e3ee" font-size="15">Rustup toolchains</text>
<path d="M990 275V330H265V385M990 330H600V385M990 330H935V385" fill="none" stroke="#8aaec8" stroke-width="2.5" stroke-dasharray="7 7"/>
</g><text x="60" y="600" fill="#8faec7" font-family="Arial" font-size="15">The host owns the source tree; the container provides a consistent Linux development toolchain.</text></svg>