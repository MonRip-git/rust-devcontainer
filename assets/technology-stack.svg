<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="t d"><title id="t">Technology stack</title><desc id="d">The environment stack from Fedora and Docker through Rust, native build tools, quality tools, and editor integrations.</desc><rect width="1200" height="540" rx="24" fill="#101827"/><text x="60" y="65" fill="#f4f8fc" font-family="Arial" font-size="30" font-weight="700">TECHNOLOGY STACK</text><g font-family="Arial"><g><rect x="90" y="110" width="1020" height="65" rx="14" fill="#1b3b59"/><text x="125" y="151" fill="#fff" font-size="22" font-weight="700">01 · Runtime</text><text x="410" y="151" fill="#c4ddec" font-size="18">Docker Engine · Docker Compose v2</text></g><g><rect x="90" y="190" width="1020" height="65" rx="14" fill="#21435d"/><text x="125" y="231" fill="#fff" font-size="22" font-weight="700">02 · Operating system</text><text x="410" y="231" fill="#c4ddec" font-size="18">Fedora Linux 45 · DNF · glibc</text></g><g><rect x="90" y="270" width="1020" height="65" rx="14" fill="#284b60"/><text x="125" y="311" fill="#fff" font-size="22" font-weight="700">03 · Rust</text><text x="410" y="311" fill="#c4ddec" font-size="18">rustup · rustc · cargo · rust-analyzer</text></g><g><rect x="90" y="350" width="1020" height="65" rx="14" fill="#315366"/><text x="125" y="391" fill="#fff" font-size="22" font-weight="700">04 · Build & quality</text><text x="410" y="391" fill="#c4ddec" font-size="18">GCC · Clang · CMake · Ninja · Clippy · Nextest</text></g><g><rect x="90" y="430" width="1020" height="65" rx="14" fill="#603d32"/><text x="125" y="471" fill="#fff" font-size="22" font-weight="700">05 · Developer experience</text><text x="490" y="471" fill="#f2d9ce" font-size="18">VS Code · Zsh · Starship · GDB · LLDB</text></g></g></svg>